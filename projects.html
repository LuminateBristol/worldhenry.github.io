<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projects</title>
  <style>
    body, html {
      margin: 0;
      font-family: sans-serif;
      background: #000;
      color: white;
    }

    .banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #000;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .sign-text, .projects-text {
      font-size: 20px;
      font-weight: 200;
      text-decoration: none;
    }

    .sign-text {
      color: white;
    }

    .projects-text {
      color: #ab456f;
    }

    .grid {
      column-count: 3;
      column-gap: 1rem;
      padding: 1rem;
    }

    .grid img {
      width: 100%;
      margin-bottom: 1rem;
      display: block;
      border-radius: 6px;
      background: #111;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .grid img:hover {
      transform: scale(1.01);
    }

    @media (max-width: 1000px) {
      .grid {
        column-count: 2;
      }
    }

    @media (max-width: 600px) {
      .grid {
        column-count: 1;
      }
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .modal img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="banner">
    <a href="index.html" class="sign-text">henry hickson</a>
    <span class="projects-text">projects</span>
  </div>

  <div class="grid">
    <img loading="lazy" src="Projects/1.jpg" alt="Project 1">
    <img loading="lazy" src="Projects/3.jpg" alt="Project 2">
    <img loading="lazy" src="Projects/8.jpg" alt="Project 3">
    <img loading="lazy" src="Projects/9.jpg" alt="Project 4">
    <img loading="lazy" src="Projects/17.jpg" alt="Project 5">
    <img loading="lazy" src="Projects/18.jpg" alt="Project 6">
    <img loading="lazy" src="Projects/26.jpg" alt="Project 7">
    <img loading="lazy" src="Projects/27.jpg" alt="Project 8">
    <img loading="lazy" src="Projects/28.jpg" alt="Project 9">
    <img loading="lazy" src="Projects/29.jpg" alt="Project 10">
    <img loading="lazy" src="Projects/30.jpg" alt="Project 11">
    <img loading="lazy" src="Projects/31.jpg" alt="Project 12">
    <!-- Add more images here -->
  </div>

  <!-- Modal element -->
  <div class="modal" id="modal">
    <img id="modalImg" src="" alt="enlarged view">
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");
    const images = document.querySelectorAll(".grid img");

    images.forEach(img => {
      img.addEventListener("click", () => {
        modal.style.display = "flex";
        modalImg.src = img.src;
      });
    });

    modal.addEventListener("click", () => {
      modal.style.display = "none";
      modalImg.src = "";
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        modal.style.display = "none";
        modalImg.src = "";
      }
    });
  </script>

</body>
</html>

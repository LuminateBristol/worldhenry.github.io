<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projects</title>
  <style>
    body, html {
      margin: 0;
      font-family: sans-serif;
      background: #000;
      color: white;
    }

    .banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #000;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .sign-text, .projects-text {
      font-size: 20px;
      font-weight: 200;
      text-decoration: none;
    }

    .sign-text {
      color: white;
    }

    .projects-text {
      color: #ab456f;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }

    .grid img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      display: block;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      background: #111;
    }
  </style>
</head>

  <div class="banner">
    <a href="index.html" class="sign-text">henry hickson</a>
    <span class="projects-text">projects</span>
  </div>

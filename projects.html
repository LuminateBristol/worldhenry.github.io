<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projects</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #000;
      color: white;
    }

    .banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #000;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .sign-text, .projects-text {
      font-size: 20px;
      font-weight: 200;
      text-decoration: none;
    }

    .sign-text {
      color: white;
    }

    .projects-text {
      color: #ab456f;
    }

    .grid {
      column-count: 3;
      column-gap: 1rem;
      padding: 1rem;
    }

    .grid img {
      width: 100%;
      margin-bottom: 1rem;
      display: block;
      border-radius: 6px;
      background: #111;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    @media (max-width: 1000px) {
      .grid {
        column-count: 2;
      }
    }

    @media (max-width: 600px) {
      .grid {
        column-count: 1;
      }
    }
  </style>
</head>
<body>

  <div class="banner">
    <a href="index.html" class="sign-text">henry hickson</a>
    <span class="projects-text">projects</span>
  </div>

  <div class="grid">
    <!-- Lazy-loaded image block -->
    <img loading="lazy" src="Projects/1.jpg" alt="Project 1">
    <img loading="lazy" src="Projects/3.jpg" alt="Project 2">
    <img loading="lazy" src="Projects/8.jpg" alt="Project 3">
    <img loading="lazy" src="Projects/9.jpg" alt="Project 4">
    <img loading="lazy" src="Projects/18.jpg" alt="Project 5">
    <!-- Add more... up to 60 or however many you need -->
  </div>

</body>
</html>
